name: YouTubeDownload
options:
  bundleIdPrefix: com.starjack1211
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGNING_ALLOWED: NO
    SWIFT_OBJC_BRIDGING_HEADER: PythonBridge/PythonBridge.h
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
targets:
  YouTubeDownload:
    type: application
    platform: iOS
    sources: [App, Shared, PythonBridge]
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
      - sdk: JavaScriptCore.framework
      - sdk: VideoToolbox.framework
      - target: DownloadShare
        embed: true
    postBuildScripts:
      - name: Embed Python standard library and extensions
        script: bash "$PROJECT_DIR/Scripts/embed_python.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload
        INFOPLIST_FILE: Config/App.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DownloadShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared, PythonBridge]
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: false
      - sdk: JavaScriptCore.framework
      - sdk: VideoToolbox.framework
    postBuildScripts:
      - name: Embed Python standard library and extensions
        script: bash "$PROJECT_DIR/Scripts/embed_python.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload.Share
        INFOPLIST_FILE: Config/Share.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DownloadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSTests]
    dependencies:
      - target: YouTubeDownload
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload.Tests
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: YouTubeDownload
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload.UITests
schemes:
  YouTubeDownload:
    build:
      targets:
        YouTubeDownload: all
    test:
      targets: [DownloadTests, AppUITests]
      gatherCoverageData: true
