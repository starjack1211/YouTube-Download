name: YouTubeDownload
options:
  bundleIdPrefix: com.starjack1211
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: NO
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
targets:
  YouTubeDownload:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: YouTubeKit
      - target: DownloadShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload
        INFOPLIST_FILE: Config/App.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DownloadShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starjack1211.YouTubeDownload.Share
        INFOPLIST_FILE: Config/Share.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  YouTubeDownload:
    build:
      targets:
        YouTubeDownload: all
