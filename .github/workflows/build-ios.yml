name: Build iPhone IPA
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reviewed extractor patch
        run: python3 Scripts/prepare_vendor.py
      - name: Test link parsing and transfer statistics
        run: swift test
      - name: Live YouTube download, merge and signature regression tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          swift test --package-path Integration | tee integration.log
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate icon and Xcode project
        run: |
          python3 Scripts/make_icon.py
          xcodegen generate
      - name: iPhone simulator download, Photos, share-input and UI tests
        timeout-minutes: 20
        run: bash Scripts/test_simulator.sh
      - name: Build iPhone app and share extension
        run: |
          set -o pipefail
          xcodebuild -project YouTubeDownload.xcodeproj -scheme YouTubeDownload \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA for iLoader
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/YouTubeDownload.app build/Payload/
          cd build
          zip -qry YouTubeDownload.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownload-IPA
          path: build/YouTubeDownload.ipa
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            integration.log
            simulator-build.log
            simulator-tests.log
            SimulatorTests.xcresult
          if-no-files-found: ignore
