name: Build iPhone IPA
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare checksum-pinned embedded Python and yt-dlp
        run: python3 Scripts/prepare_python.py
      - name: Test Python quality selection, cancellation and real HTTP transfers
        id: python_tests
        continue-on-error: true
        env:
          PYTHONPATH: PythonApp:Vendor/python_packages
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s PythonTests -p test_download_core.py -v
      - name: Test link parsing and transfer statistics
        id: unit_tests
        continue-on-error: true
        run: swift test
      - name: Live Python YouTube downloads
        id: live_tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: PythonApp:Vendor/python_packages
          PYTHONDONTWRITEBYTECODE: "1"
          RUN_LIVE_TESTS: "1"
        run: |
          set -o pipefail
          python3 -m unittest discover -s PythonTests -p test_live.py -v 2>&1 | tee integration.log
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate icon and Xcode project
        run: |
          python3 Scripts/make_icon.py
          xcodegen generate
      - name: iPhone embedded Python, download, Photos, share-input and UI tests
        id: simulator_tests
        continue-on-error: true
        timeout-minutes: 25
        run: bash Scripts/test_simulator.sh
      - name: Require every test suite to pass before packaging
        env:
          PYTHON_RESULT: ${{ steps.python_tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          LIVE_RESULT: ${{ steps.live_tests.outcome }}
          SIMULATOR_RESULT: ${{ steps.simulator_tests.outcome }}
        run: |
          echo "Python tests: $PYTHON_RESULT"
          echo "Swift tests: $UNIT_RESULT"
          echo "Live YouTube tests: $LIVE_RESULT"
          echo "iPhone simulator tests: $SIMULATOR_RESULT"
          test "$PYTHON_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$LIVE_RESULT" = success
          test "$SIMULATOR_RESULT" = success
      - name: Build iPhone app and share extension
        run: |
          set -o pipefail
          xcodebuild -project YouTubeDownload.xcodeproj -scheme YouTubeDownload \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA for iLoader
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/YouTubeDownload.app build/Payload/
          cd build
          zip -qry YouTubeDownload.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownload-IPA
          path: build/YouTubeDownload.ipa
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            integration.log
            simulator-build.log
            simulator-tests.log
            SimulatorTests.xcresult
          if-no-files-found: ignore
