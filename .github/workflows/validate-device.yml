name: Validate Python backend tests
on:
  push:
    branches: [python-device-check]
permissions:
  contents: read
jobs:
  python:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Python dependencies
        run: python3 Scripts/prepare_python.py --packages-only
      - name: Run all Python core and native-provider tests
        env:
          PYTHONPATH: PythonApp:Vendor/python_packages
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s PythonTests -p test_download_core.py -v
